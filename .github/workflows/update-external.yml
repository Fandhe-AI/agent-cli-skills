# 外部ソース（submodule 参照・エージェントスキル）の自動追従ワークフロー。
#
# 実装本体は Fandhe-AI/actions の reusable workflow `.github/workflows/update-external.yml`
# （Fandhe-AI/agent-cli-skills イシュー #259 で reusable 化）。本ファイルはリポジトリ固有の
# 設定だけを持つ薄い wrapper であり、fail-closed ガード・`persist-credentials`・
# `source-token`・外部 action の pin・Node / skills CLI の版数は共通側で集中管理される。
#
# 移行前は本リポジトリでテンプレートを手管理していた。`.github/workflows/**` は
# skills-update の配布対象外で上流の強化が届かないため、乖離が固定化していた
# （Fandhe-AI/agent-cli-skills イシュー #261）。移行前ファイルが直接ピンしていた
# `submodule-update@fed9c07d98367f77e5e2b63bca38843f46feee96` は、以後 reusable workflow 側が集中管理する。
#
# 参照 SHA の検証記録（2026-08-17 実測）:
# - 到達性: `gh api repos/Fandhe-AI/actions/compare/main...8dea43ee40a7137f47fa974df2f297d1938ac48c`
#   → `{"status":"identical","ahead_by":0,"behind_by":0}`。upstream main の祖先であることを
#   確認した（実測時点では main の tip そのもの）。以後 main が進めば status は behind へ
#   変わるが、`ahead_by: 0` が保たれる限り祖先である事実は変わらない
# - コミット: feat(update-external): 古い日次更新 PR の自動 close をオプトインで追加 (#80)
#   （2026-08-17T06:30:27Z）
# - 入力契約: 同 SHA の `.github/workflows/update-external.yml` を contents API で取得し
#   `on.workflow_call` を確認。inputs 11 件（target / runner-json / base-branch /
#   enable-submodule / enable-skills / submodule-auto-merge{,-allowlist} /
#   skills-auto-merge{,-allowlist} / submodule-close-superseded / skills-close-superseded）・
#   secrets 2 件（SUBMODULE_PAT / SKILLS_PAT）で、いずれも required: false。本ファイルの
#   with / secrets がこの契約の範囲内であることを機械照合した
# - 権限: 呼び出し先ジョブの permissions は validate-inputs `{}`・submodule / skills が
#   `contents: read`。reusable workflow の権限は呼び出し側以下である必要があり、本ファイルの
#   `permissions: contents: read` で充足する
# - 実行時間上限: 呼び出し先ジョブは validate-inputs 5 分・submodule 10 分・skills 15 分の
#   `timeout-minutes` を持つ（移行前の各ジョブと同値）。reusable workflow を呼ぶジョブ自身には
#   `timeout-minutes` を設定できないため、上限は上流のこの契約で担保される
#
#   既知の未解決課題（Fandhe-AI/agent-cli-skills イシュー #299）: 上限は固定値で、
#   `workflow_call` の inputs に timeout 系が無いため呼び出し側から引き上げる手段が
#   存在しない。#261 の wrapper 移行時に全リポの直近成功 run を実測したところ、
#   fandhe-multi-platform の skills ジョブが 14分51秒（上限 15 分に対し残り 9 秒）で、
#   わずかな変動で打ち切られ得る状態にある。この上限自体は移行前も同リポで 15 分の
#   ため #261 による後退ではないが、テールリスクとして記録する。
#   根本修正（`submodule-timeout-minutes` / `skills-timeout-minutes` を
#   `workflow_call` の input として追加する、または固定値を引き上げる）は
#   本ファイルではなく上流 `Fandhe-AI/actions/.github/workflows/update-external.yml`
#   側の変更が必要で、`8dea43ee40a7137f47fa974df2f297d1938ac48c` 時点の
#   `on.workflow_call.inputs`（11 件）にも timeout 系は未追加であることを
#   contents API で実測確認済み（2026-08-18）。上流が inputs を追加して pin SHA を
#   更新するまで、本 wrapper 側で `with:` に未知の timeout input を書いても
#   reusable workflow 側は警告のみで無視し job は緑のまま通る（Fandhe-AI/actions PR #80 の
#   `skills-version` と同型の危険）ため、先行して書き込まない
# - タグ未公開（0 tags / 0 releases）のため SHA 固定が必須で、Dependabot による自動更新は
#   効かない。上流更新時は本記録ごと手で差し替える
#
# runner 選択の根拠:
# 移行前は `runs-on: ${{ fromJSON(vars.UPDATE_EXTERNAL_RUNNER || '"ubuntu-latest"') }}` だった。
# この組織変数は org・リポジトリのいずれにも未設定であることを `gh variable list` で実測して
# おり、実効値は常にフォールバックの ubuntu-latest だった。よって直書きしても挙動は変わらない。
# あわせて、組織変数への間接参照は PR #77 codex-review P1 で「実効値がファイルを読むだけでは
# 確定しない」として却下された形式でもあるため、ここでは JSON リテラルを直書きする。

name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象（手動実行時のみ有効。schedule は常に all）'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  update-external:
    # Fandhe-AI/actions はタグ未公開のため main 追従の最新コミット SHA に固定する
    uses: Fandhe-AI/actions/.github/workflows/update-external.yml@8dea43ee40a7137f47fa974df2f297d1938ac48c # main
    permissions:
      contents: read
    with:
      # schedule 起動では inputs が null になるため all へフォールバックする
      target: ${{ inputs.target || 'all' }}
      # runs-on へ渡す JSON リテラル（素の self-hosted は fromJSON が失敗する）
      runner-json: '"ubuntu-latest"'
      # auto-merge はマージ可否を左右する設定のため、組織変数を呼び出し側で解決して渡す。
      # 未設定（null/空）を有効と解釈する composite action の非対称設計に合わせ、
      # 明示的に 'false' へフォールバックしオプトイン運用とする。
      submodule-auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
      submodule-auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
      skills-auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
      skills-auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
    secrets:
      # 未登録の secret は空文字となり、共通側のガードが checkout 前に fail-closed で止める。
      # SKILLS_PAT 未登録時は共通側が SUBMODULE_PAT へフォールバックする。
      SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
      SKILLS_PAT: ${{ secrets.SKILLS_PAT }}
