name: Update external pin bump

# --------------------------------------------------------------------------
# 下流 wrapper の pin SHA を自動追従させる（イシュー #343）
# --------------------------------------------------------------------------
# update-external-drift.yml（乖離検知）が「実効差分あり」と判定した wrapper
# だけを対象に、pin bump PR を自動生成する。判定ロジック（実効差分ゲート）は
# .github/scripts/check_update_external_drift.py の evaluate_pin_impact を
# .github/scripts/bump_update_external_pin.py が import して再利用しており、
# 乖離検知と bump 対象の選定基準を 2 箇所に重複させない。
#
# 採否の経緯・却下した代替案（skills-update 配布への追加・可動参照 @main への
# 変更・タグ/リリース発行 + Dependabot 等）は docs/update-external-pin.md を
# 参照。
#
# auto-merge は付けない。生成する PR は人間のレビューを必須にする。

on:
  schedule:
    # 04:00 UTC = 13:00 JST。乖離検知（03:00 UTC）の後段に置き、直前の
    # 走査結果が古くなる前に bump 対象を選定する。
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: '対象一覧と契約ゲート結果だけを出力し、書き込み API を呼ばない'
        type: boolean
        required: false
        default: true
      limit:
        description: '1 run あたりに作成する PR 数の上限'
        type: string
        required: false
        default: '5'
      only:
        description: '対象を 1 リポジトリに絞る（owner/repo 形式。空なら全対象）'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: update-external-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump downstream update-external pins
    runs-on: ubuntu-latest
    # 対象は多くて 18 リポ程度（実測、イシュー #343 E4）。ネットワークハングで
    # ランナーを占有し続けないよう上限を置く。
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # PAT 不在は「対象 0 件」に化ける（走査もブランチ作成もできず黙って
      # 何もしないまま終わる）ため、乖離検知と同じ理由で先に fail-closed で
      # 落とす。schedule 実行では常に非 dry-run で書き込みを行うため、
      # Contents: write / Pull requests: write（対象リポ側）も必要になるが、
      # スコープ不足は個別リポの PUT/POST が 403/422 を返した時点で
      # bump_update_external_pin.py がそのリポを失敗として報告する
      # （復旧手順は docs/update-external-pin.md 参照）。
      - name: Verify SUBMODULE_PAT is configured
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAT}" ]; then
            msg="組織シークレット SUBMODULE_PAT (visibility: all) が未設定。"
            msg="${msg}他リポジトリの読み取り・書き込みができないため fail-closed で停止する。"
            echo "::error::${msg}"
            exit 1
          fi

      - name: Setup Python
        # actions/setup-python v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Bump downstream pins
        env:
          TARGET_ORG: Fandhe-AI
          READ_TOKEN: ${{ secrets.SUBMODULE_PAT }}
          # schedule 実行は常に非 dry-run（実際に PR を作る）。workflow_dispatch
          # は入力の dry-run（既定 true）に従う。
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry-run && 'true' || 'false') }}
          BUMP_LIMIT: ${{ inputs.limit || '5' }}
          ONLY_REPO: ${{ inputs.only || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/bump_update_external_pin.py
