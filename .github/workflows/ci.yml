name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # スキル構造検証（依存なし・全 PR / push 共通）
  # --------------------------------------------------
  # 各 skills/<name>/SKILL.md の frontmatter (name / description)、
  # name とディレクトリ名の一致、.claude/skills/ の symlink リンク切れ、
  # skills-lock.json の存在と JSON 妥当性を bash で検証する。
  structure:
    name: Skill structure check
    runs-on: ubuntu-latest
    # bash + grep のみの軽量ジョブ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate skill structure
        run: bash .github/scripts/check-skill-structure.sh

  # --------------------------------------------------
  # markdownlint（全 markdown の lint）
  # --------------------------------------------------
  # npx 直呼びの個別実装から Fandhe-AI/actions の lint-docs reusable workflow
  # （SHA 固定・markdownlint-cli バージョンは共通側で固定）へ置換した（イシュー #67）。
  # ルール設定は `.markdownlint.jsonc`、除外は `.markdownlintignore` を参照する
  # （緑のベースライン構成）。structure 等リポジトリ固有ジョブは現状維持。
  lint-docs:
    # <SHA> は Fandhe-AI/actions のコミット SHA で固定する（@main 不可）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      # 本イシューの置換対象は markdownlint のみ。editorconfig / yamllint /
      # commitlint は従来 CI に存在しないため無効化する（commitlint は
      # pull_request 専用のため、push でも動く本 workflow では有効化する場合
      # github.event_name での切り替えが必要になる点にも注意）
      markdownlint: true
      editorconfig: false
      yamllint: false
      commitlint: false
