name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # スキル構造検証（依存なし・全 PR / push 共通）
  # --------------------------------------------------
  # 各 skills/<name>/SKILL.md の frontmatter (name / description)、
  # name とディレクトリ名の一致、.claude/skills/ の symlink リンク切れ、
  # skills-lock.json の存在と JSON 妥当性を bash で検証する。
  structure:
    name: Skill structure check
    runs-on: ubuntu-latest
    # bash + grep のみの軽量ジョブ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate skill structure
        run: bash .github/scripts/check-skill-structure.sh

  # --------------------------------------------------
  # js-tests（implement-issue-tree G0 ゲート等の決定的回帰テスト）
  # --------------------------------------------------
  # tests/ 配下の node:test スイートを実行する。package.json・外部依存なしの
  # 標準ライブラリのみで動く構成だが、--test の glob 指定は Node 21+ が必要で
  # runner 同梱 Node のバージョンは契約されていないため、setup-node で Node 22 を
  # 明示的に固定する。
  js-tests:
    name: JS unit tests
    runs-on: ubuntu-latest
    # 依存インストールなしの軽量ジョブ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run node:test suite
        run: |
          node --version
          node --test "skills/**/*.test.mjs"

  # --------------------------------------------------
  # py-tests（update-external 乖離検知の判定ロジック回帰テスト）
  # --------------------------------------------------
  # .github/scripts/check_update_external_drift.py の純粋関数（分類・pin 比較・
  # 軸 4 のジョブ単位判定）を fixture に対して実行する（イシュー #260）。
  # 検知ワークフロー本体は日次 schedule で走るため、壊れても PR 時点では気づけない。
  # 特に「submodule ジョブの既定 true を誤検知しない」というジョブ単位判定は
  # ファイル全体 grep への退行が起きやすく、退行しても検知ジョブは緑のまま
  # 誤ったレポートを出し続ける。ここで PR ごとに固定する。
  py-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    # PyYAML の取得と unittest のみ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Python
        # actions/setup-python v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - name: Run drift checker unit tests
        run: |
          # runner イメージ同梱の PyYAML 有無は契約されていないため明示的に入れる。
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 .github/scripts/test_check_update_external_drift.py

  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # npx 直呼びの個別実装から Fandhe-AI/actions の lint-docs reusable workflow
  # （SHA 固定・lint ツールバージョンは共通側で固定）へ置換した（イシュー #67）。
  # markdownlint の設定は `.markdownlint.jsonc`、除外は `.markdownlintignore` を
  # 参照する（緑のベースライン構成）。イシュー #73 で editorconfig / yamllint /
  # commitlint も有効化した（設定はそれぞれ `.editorconfig` / `.yamllint` /
  # `commitlint.config.mjs` を参照）。structure 等リポジトリ固有ジョブは現状維持。
  lint-docs:
    # <SHA> は Fandhe-AI/actions のコミット SHA で固定する（@main 不可）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}
